<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyranix Arcade — Player</title><script src="https://unpkg.com/@ruffle-rs/ruffle"></script><link rel="stylesheet" href="assets/style.css"></head><body class="player-page">
<header class="playerbar"><a class="btn secondary" href="index.html">← Arcade</a><div id="title" class="title">Loading…</div><div class="spacer"></div><button id="fav" class="btn secondary">☆ Favorite</button><a id="info" class="btn secondary">ℹ Info</a><a class="btn secondary" href="saves.html">💾 Saves</a><button class="btn secondary" onclick="fs()">⛶ Fullscreen</button></header>
<main class="player-wrap"><div style="width:min(1280px,100%)"><div class="player-shell"><div id="ruffle-container"></div></div><div class="notice">💾 <b>Progress saves automatically.</b> Supported Flash game saves are persisted by Ruffle in this browser. For a portable backup, right-click inside the game and open Ruffle's Save Manager.</div></div></main>
<script src="assets/games.js"></script><script src="assets/save.js"></script><script>
const id=new URLSearchParams(location.search).get('game'),g=GAMES.find(x=>x.id===id),c=document.getElementById('ruffle-container'),t=document.getElementById('title'),f=document.getElementById('fav');
function fs(){let e=document.querySelector('.player-shell');document.fullscreenElement?document.exitFullscreen():e.requestFullscreen?.()}
if(!g){t.textContent='Game not found';c.innerHTML='<div class="player-error"><div><h2>Game not found</h2><p>Return to the arcade.</p></div></div>'}
else{t.textContent=g.title;document.title=g.title+' — Lyranix Arcade';document.getElementById('info').href='game-info.html?game='+encodeURIComponent(id);LyranixSaves.recent(id);f.textContent=LyranixSaves.isFavorite(id)?'★ Favorited':'☆ Favorite';f.onclick=()=>f.textContent=LyranixSaves.toggleFavorite(id)?'★ Favorited':'☆ Favorite';
const r=window.RufflePlayer?.newest();if(!r)c.innerHTML='<div class="player-error"><div><h2>Ruffle could not load</h2><p>Check your network connection.</p></div></div>';else{const p=r.createPlayer();p.style.width='100%';p.style.height='100%';c.appendChild(p);p.ruffle().load({url:g.swf,autoplay:'on',letterbox:'fullscreen',compatibilityRules:true,upgradeToHttps:true,allowScriptAccess:false,showSwfDownload:false,contextMenu:true,splashScreen:true});}}
</script></body></html>
